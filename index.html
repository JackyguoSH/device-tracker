<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>kept · 设备账本</title>
<style>
:root {
  color-scheme:dark;
  --bg:#08090b; --surface:#1c1c1e; --inset:#262628; --control:#303033; --selected:#505054;
  --line:#353538; --grid:#414145; --ink:#f7f7f8; --muted:#a1a1aa; --sub:#a1a1aa;
  --accent:#0091ff; --investment-color:#6d7cff; --cost-color:#ff9230; --bar:#929298; --bar-secondary:#636369; --bar-track:#2c2c2e; --danger:#ff8386;
  --glass-solid:#262629; --glass-tint:rgb(46 46 51 / .57); --glass-dense:rgb(26 26 29 / .84);
  --glass-edge:rgb(255 255 255 / .15); --glass-lip:rgb(255 255 255 / .39);
  --glass-inner:rgb(255 255 255 / .10); --glass-shade:rgb(0 0 0 / .48);
  --glass-well:rgb(14 14 17 / .87); --glass-hover:rgb(255 255 255 / .09);
  --glass-sample:blur(12px) saturate(145%) brightness(.76);
  --glass-primary:rgb(0 145 255 / .84); --scroll-veil:rgb(8 9 11 / .74);
  --pane-solid:#1c1c21; --pane-tint:rgb(46 46 55 / .52); --pane-edge:rgb(255 255 255 / .10);
  --pane-lip:rgb(255 255 255 / .17); --pane-inner:rgb(255 255 255 / .035);
  --well-tint:rgb(255 255 255 / .055); --well-lip:rgb(255 255 255 / .09);
  --series:#a7b4da; --series-archived:#90919d;
  --radius:28px; --gutter:clamp(18px,4vw,64px);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-synthesis:none;
}
:root[data-theme="light"] {
  color-scheme:light;
  --bg:#f2f2f7; --surface:#fff; --inset:#f2f2f7; --control:#e7e7ec; --selected:#fff;
  --line:#dddde3; --grid:#d5d5dd; --ink:#17171a; --muted:#5c5c67; --sub:#62626c;
  --accent:#0063bb; --investment-color:#564ade; --cost-color:#b74d00; --bar:#6c6c74; --bar-secondary:#83838a; --bar-track:#e9e9ed; --danger:#a62a30;
  --glass-solid:#f6f6fa; --glass-tint:rgb(255 255 255 / .63); --glass-dense:rgb(247 247 251 / .90);
  --glass-edge:rgb(32 32 62 / .12); --glass-lip:rgb(255 255 255 / .96);
  --glass-inner:rgb(255 255 255 / .56); --glass-shade:rgb(30 30 52 / .15);
  --glass-well:rgb(255 255 255 / .91); --glass-hover:rgb(0 0 0 / .07);
  --glass-sample:blur(12px) saturate(135%) brightness(1.04);
  --glass-primary:rgb(0 99 187 / .94); --scroll-veil:rgb(242 242 247 / .82);
  --pane-solid:#fff; --pane-tint:rgb(255 255 255 / .68); --pane-edge:rgb(31 35 63 / .085);
  --pane-lip:rgb(255 255 255 / .92); --pane-inner:rgb(255 255 255 / .55);
  --well-tint:rgb(49 53 86 / .06); --well-lip:rgb(255 255 255 / .75);
  --series:#596d9e; --series-archived:#626575;
}
* {box-sizing:border-box}
html {scroll-padding:90px 0 23px}
body {margin:0;background:var(--bg);color:var(--ink);font-size:16px}
h1,h2,h3,p,figure {margin:0}
h1,h2,h3 {text-wrap:balance}
button,input,select,textarea {font:inherit}
button {border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
button:disabled {opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {
  outline:2px solid var(--accent);outline-offset:3px
}
main[tabindex]:focus {outline:0}
[hidden] {display:none!important}
.icon {width:20px;height:20px;display:block;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.skip {position:fixed;top:7px;left:10px;z-index:8;transform:translateY(-150%);padding:12px 16px;background:var(--surface);color:var(--ink);border-radius:10px}
.skip:focus {transform:none}

.top {position:sticky;z-index:4;top:0}
.top::before {position:absolute;content:"";inset:0 0 -20px;pointer-events:none;background:var(--scroll-veil);mask-image:linear-gradient(#000 38%,transparent);opacity:0}
.top[data-scrolled]::before {opacity:1}
.glass {
  border:1px solid var(--glass-edge);background:var(--glass-solid);corner-shape:round;
  box-shadow:inset 0 1px 1px var(--glass-lip),inset 1px 0 2px var(--glass-inner),
    inset 0 -1px 2px var(--glass-inner),0 5px 18px -8px var(--glass-shade);
}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)) {
  .glass:not([hidden]) {
    background:var(--glass-tint);
    -webkit-backdrop-filter:var(--glass-sample);
    backdrop-filter:var(--glass-sample) var(--glass-lens,);
  }
}
.top-inner,main,.footer {max-width:1536px;margin-inline:auto;padding-inline:var(--gutter)}
.top-inner {height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand {position:relative;color:var(--ink);text-decoration:none;justify-self:start;text-align:left;padding:5px 0;font-size:28px;font-weight:740;letter-spacing:-.065em;line-height:1}
.brand-dot {color:var(--muted)}
.navigation {
  position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;
  padding:4px;width:226px;border-radius:99px;--tab-x:0%;
}
.navigation[data-current="devices"] {--tab-x:calc(100% + 2px)}
.navigation::before {
  content:"";position:absolute;inset-block:4px;left:4px;width:calc((100% - 10px)/2);
  background:var(--glass-well);border-radius:99px;pointer-events:none;
  transform:translateX(var(--tab-x));
  box-shadow:inset 0 1px 0 var(--glass-inner),0 1px 5px var(--glass-shade);
}
.navigation a {
  position:relative;text-decoration:none;color:var(--ink);display:flex;align-items:center;justify-content:center;
  gap:8px;min-height:44px;padding:8px 12px;border-radius:99px;font-size:15px;font-weight:610;white-space:nowrap;
}
.navigation a[aria-current="page"] {color:var(--accent)}
.navigation .icon {width:19px;height:19px}
.top-actions {position:relative;display:flex;justify-self:end;align-items:center;gap:3px;padding:3px;border-radius:99px}
.icon-button,.primary,.secondary,.quiet {display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 15px;border-radius:99px;white-space:nowrap;font-size:15px;font-weight:610}
.icon-button {width:44px;padding:0;background:var(--inset)}
.primary {background:var(--accent);color:var(--bg)}
:root[data-theme="light"] .primary {color:#fff}
.secondary {background:var(--control)}
.quiet {color:var(--accent);padding-inline:6px}
.top-actions .icon-button {background:none}
.top-actions .primary {
  width:44px;padding:0;background:var(--glass-primary);
  box-shadow:inset 0 1px 1px var(--glass-lip);
}
.top-actions .add-label {display:none}
@media (hover:hover) {
  .navigation a:hover,.top-actions .icon-button:hover {background:var(--glass-hover)}
  .date-chip.glass:hover {border-color:var(--glass-lip);color:var(--ink)}
  .icon-button:hover,.secondary:hover {background:var(--selected)}
  .primary:hover {filter:brightness(1.12)}
  .quiet:hover {text-decoration:underline}
}

main {min-height:calc(100vh - 157px);padding-top:29px;padding-bottom:56px}
.page-heading {display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 4px 27px}
h1 {font-size:clamp(38px,4.6vw,63px);font-weight:760;line-height:1.09;letter-spacing:-.065em}
.page-heading p {margin-top:8px;color:var(--muted)}
.date-chip {display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 13px;border-radius:99px;color:var(--muted);white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.date-chip .icon {width:17px;height:17px}
.card {
  background:var(--pane-solid);border:1px solid var(--pane-edge);border-radius:var(--radius);min-width:0;
  corner-shape:round;
  box-shadow:inset 0 1px 0 var(--pane-lip),inset 0 0 12px var(--pane-inner),0 10px 24px -14px var(--glass-shade);
}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)) {
  .card {background:var(--pane-tint);-webkit-backdrop-filter:blur(16px) saturate(118%);backdrop-filter:blur(16px) saturate(118%)}
}
.card-top,.chart-top {display:flex;justify-content:space-between;align-items:center;gap:8px}
.accent-heading {display:flex;align-items:center;gap:9px;color:var(--topic-color,var(--ink));font-size:20px;font-weight:690;letter-spacing:-.025em;white-space:nowrap}
.accent-heading .icon {color:var(--topic-color,var(--muted));width:21px;height:21px;stroke-width:2.05}
.summary-bottom,.analytics-grid {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px;
  --dashboard-title:19px;--dashboard-text:15px;--dashboard-meta:13px;--dashboard-number:32px;--dashboard-padding:22px;
}
.analytics-grid {grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.analytics-sidebar {display:grid;gap:inherit;min-width:0}
.analytics-grid .card,.summary-bottom .card {padding:var(--dashboard-padding)}
.analytics-grid .accent-heading,.summary-bottom .accent-heading,.activity-title {font-size:var(--dashboard-title);font-weight:690;letter-spacing:-.025em}
/* Apple HIG dark system blue, indigo and orange. Hue follows the metric across views. */
.investment-card,.composition-card {--topic-color:var(--investment-color)}
.trend-card,.rank-card {--topic-color:var(--cost-color)}
.summary-card>.accent-heading,.analytics-grid .card-top,.summary-bottom .card-top {min-height:38px}
.summary-figure {
  font-size:var(--dashboard-number);line-height:1.12;letter-spacing:-.045em;
  font-weight:670;margin-top:10px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums
}
.summary-figure small {font-size:var(--dashboard-text);letter-spacing:0;color:var(--muted);font-weight:570;white-space:nowrap}
.summary-caption {font-size:var(--dashboard-meta);line-height:1.4;color:var(--muted);margin-top:5px}
.comparator,.device-matrix {border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
.comparator {display:grid;gap:11px}
.trend-card {grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);align-items:center;gap:18px}
.cost-deltas {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0}
.cost-deltas>div {display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:5px 16px;border-left:1px solid var(--line)}
.cost-deltas>div:last-child {padding-right:0}
.cost-deltas dt {color:var(--muted);font-size:var(--dashboard-meta)}
.cost-deltas dd {margin:0;font-size:var(--dashboard-text);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.cost-deltas small {font-size:var(--dashboard-meta);color:var(--muted);font-weight:500}
.comparison {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 9px}
.comparison strong {font-size:var(--dashboard-text);font-weight:650;font-variant-numeric:tabular-nums}
.comparison>span {grid-column:2;grid-row:1;font-size:var(--dashboard-meta);color:var(--muted)}
.comparison-track {height:6px;grid-column:1/-1;border-radius:6px;background:var(--bar-track);overflow:hidden}
.comparison-track>span {display:block;width:var(--length);height:100%;background:var(--investment-color);border-radius:6px}
.comparison+.comparison .comparison-track>span {background:var(--bar-secondary)}
.status-actions {display:flex;gap:13px;flex-wrap:wrap}
.status-actions button {display:inline-flex;align-items:center;gap:7px;min-height:26px;padding:0;color:var(--ink);font-weight:inherit}
.status-actions button:hover {text-decoration:underline}
.status-key {width:8px;height:8px;border-radius:50%;background:var(--ink)}
.archived-key {border:1px solid var(--muted);background:transparent}
.device-matrix {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 5px}
.matrix-icon {
  min-width:0;min-height:61px;display:grid;grid-template-rows:29px auto;justify-items:center;align-items:center;
  gap:4px;padding:5px 1px;border:1px solid transparent;border-radius:12px;color:var(--ink);
}
.matrix-icon:hover,.matrix-icon:focus-visible {
  background:var(--well-tint);border-color:var(--pane-edge);box-shadow:inset 0 1px 0 var(--well-lip);
}
.matrix-art {display:grid;place-items:center;width:100%;height:29px}
.device-glyph {width:25px;height:25px;display:block;flex:none}
.matrix-art .device-glyph {width:28px;height:28px;color:var(--ink)}
.matrix-name {
  max-width:100%;align-self:start;font-size:11px;font-weight:560;line-height:1.2;
  overflow-wrap:anywhere;text-align:center;
}
.matrix-inactive,.matrix-inactive .matrix-art .device-glyph {color:var(--muted)}

.segment {
  display:flex;gap:2px;padding:3px;background:var(--well-tint);border:1px solid var(--pane-edge);
  border-radius:99px;flex:none;box-shadow:inset 0 1px 0 var(--well-lip);
}
.segment button {min-height:30px;padding:5px 8px;border-radius:99px;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:550}
.segment button:hover {color:var(--ink)}
.segment button[aria-pressed="true"] {
  background:var(--well-tint);color:var(--ink);font-weight:660;
  box-shadow:inset 0 1px 1px var(--pane-lip),inset 0 0 0 1px var(--pane-edge),0 2px 4px var(--glass-shade);
}
:root[data-theme="light"] .segment button[aria-pressed="true"] {background:var(--glass-well)}
.plot {position:relative;min-width:0}
.plot canvas {display:block;width:100%;height:172px;border-radius:4px;touch-action:pan-y}
.plot-output {position:absolute;z-index:1;top:1px;left:7px;pointer-events:none;background:var(--glass-solid);border:1px solid var(--pane-edge);padding:6px 8px;border-radius:10px;box-shadow:inset 0 1px 0 var(--pane-lip);font-size:12px;white-space:nowrap}
.plot-footer {display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.delta {color:var(--muted)}

.card-list {margin-top:4px}
.device-line {width:100%;display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:0 12px;text-align:left;padding:0;min-height:68px}
.device-line+.device-line .device-content,.device-line+.device-line .device-trailing {border-top:1px solid var(--line)}
.rank-icon {
  display:grid;place-items:center;width:45px;height:45px;padding:5px;flex:none;
  color:var(--muted);border:1px solid var(--pane-edge);background:var(--well-tint);border-radius:12px;
  box-shadow:inset 0 1px 0 var(--well-lip);
}
.rank-icon .device-glyph {width:24px;height:24px;color:var(--ink)}
.device-content,.device-trailing {min-height:68px;display:flex;flex-direction:column;justify-content:center;min-width:0;gap:4px}
.device-copy {display:grid;grid-template-columns:minmax(0,1fr) auto}
.device-trailing {text-align:right;padding-left:10px}
.device-name {display:block;font-size:17px;font-weight:580;overflow-wrap:anywhere}
.device-meta {display:block;color:var(--muted);font-size:13px}
.device-money {color:var(--ink);font-variant-numeric:tabular-nums;font-size:18px;letter-spacing:-.025em}
.device-money small,.rank-value small {color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
.activity-card .device-name,.activity-card .device-money {font-size:var(--dashboard-text)}
.activity-card .device-content,.activity-card .device-trailing {min-height:62px}
.device-date {font-size:13px;color:var(--muted);white-space:nowrap}
.device-line:hover .device-name,.timeline-label:hover .device-name {color:var(--accent)}
.rank-list,.distribution {display:grid;margin-top:11px}
.dashboard-note {color:var(--muted);font-size:var(--dashboard-meta);margin-top:8px;font-variant-numeric:tabular-nums}
.rank-card .rank-list {margin-top:5px}
.rank-row,.distribution-row {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 9px;align-items:center;text-align:left;padding:9px 0;min-height:46px}
.rank-row+.rank-row,.distribution-row+.distribution-row {border-top:1px solid var(--line)}
.rank-name,.distribution-row>span:first-child {font-size:15px;font-weight:590;overflow-wrap:anywhere}
.rank-value,.distribution-row strong {text-align:right;font-size:15px;font-weight:660;white-space:nowrap;font-variant-numeric:tabular-nums}
.rank-row:hover .rank-name,.distribution-row:hover>span:first-child {color:var(--accent)}
.rank-bar,.distribution-bar {height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden}
.rank-bar {grid-column:1/-1}
.rank-bar span,.distribution-bar span {display:block;height:100%;width:var(--fill);border-radius:inherit;background:var(--bar)}
/* Highlight the leader in the ranked list and use one hue for the entire breakdown. */
.distribution-bar span {background:var(--investment-color)}
.rank-row:first-child .rank-bar span:not(.recovery-bar) {background:var(--cost-color)}
.rank-bar .recovery-bar {background:var(--series-archived)}
.distribution-row small {text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.toolbar {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.controls {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field-control,.search {min-width:0;min-height:44px;border:1px solid transparent;border-radius:11px;background:var(--inset);color:var(--ink)}
.field-control {padding:7px 11px;width:100%}
select.field-control {appearance:auto;padding-right:10px}
.controls>.field-control {width:auto}
.search {display:flex;align-items:center;gap:8px;padding:0 11px}
.toolbar .field-control,.search {
  background:var(--well-tint);border-color:var(--pane-edge);box-shadow:inset 0 1px 0 var(--well-lip);
}
.search .icon {width:17px;height:17px;color:var(--muted)}
.search input {width:clamp(110px,21vw,232px);min-width:0;height:42px;padding:0;border:0;background:transparent;color:var(--ink)}
.search input:focus-visible {outline:0}
.search:focus-within {outline:2px solid var(--accent);outline-offset:2px}
.search input::placeholder {color:var(--muted)}
.collection-toolbar {display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.collection-controls {display:grid;grid-template-columns:minmax(0,1fr) auto;position:relative}
.collection-controls .search input {width:100%}
.filter-toggle {
  display:flex;align-items:center;justify-content:space-between;gap:7px;list-style:none;cursor:pointer;
  padding-inline:12px;font-size:14px;font-weight:610;white-space:nowrap;
}
.filter-toggle::-webkit-details-marker {display:none}
.filter-toggle .icon {width:15px;height:15px;color:var(--muted)}
.collection-filters[open] .filter-toggle .icon {transform:rotate(180deg)}
.filter-count {
  display:grid;place-items:center;min-width:19px;height:19px;border-radius:10px;
  color:var(--accent);background:var(--well-tint);font-size:11px;font-variant-numeric:tabular-nums;
}
.filter-menu {
  position:absolute;z-index:3;inset-block-start:calc(100% + 8px);inset-inline-end:0;
  width:min(426px,100%);max-height:min(70svh,530px);overflow-y:auto;
  padding:16px;background:var(--glass-dense);
}
.filter-menu fieldset {min-width:0;margin:0 0 14px;padding:0;border:0}
.filter-menu legend {margin-bottom:6px;padding:0;color:var(--muted);font-size:12px;font-weight:610}
.filter-options {display:flex;flex-wrap:wrap;gap:6px}
.filter-options label {position:relative;min-width:0;cursor:pointer}
.filter-options input {position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.filter-options span {
  display:flex;align-items:center;min-height:34px;padding:4px 10px;border-radius:9px;
  border:1px solid var(--pane-edge);background:var(--well-tint);font-size:13px;
}
.filter-options input:checked+span {color:var(--accent);border-color:var(--accent);background:var(--glass-well)}
.filter-options input:focus-visible+span {outline:2px solid var(--accent);outline-offset:2px}
.filter-actions {display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line)}
.filter-actions button {min-height:38px}
.collection-views {display:flex;align-items:center;justify-content:space-between;gap:8px}
.result-text {font-size:13px;color:var(--muted);margin:0 4px}
.brand-groups {display:grid;gap:14px}
.brand-group h2 {display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 9px;font-size:18px;overflow-wrap:anywhere}
.brand-group h2 span {color:var(--muted);font-size:13px;font-weight:540;white-space:nowrap}
.device-list {padding:0 22px}
.timeline {padding:10px 21px}
.timeline-row,.timeline-axis {display:grid;grid-template-columns:minmax(160px,.8fr) minmax(0,2fr) 110px;align-items:center;gap:16px}
.timeline-axis {color:var(--muted);font-size:13px;padding:9px 0}
.timeline-axis>span:last-child {text-align:right}
.timeline-row {min-height:69px;border-top:1px solid var(--line)}
.timeline-label {display:flex;align-items:center;text-align:left;gap:10px;padding:4px 0;min-width:0}
.track {position:relative;height:40px;padding:0;text-align:left;width:100%;border-radius:5px}
.track:hover {background:var(--inset)}
.track-fill {position:absolute;top:17px;height:6px;min-width:3px;border-radius:4px;background:var(--bar)}
.track-point {position:absolute;top:15px;width:10px;height:10px;border-radius:3px;background:var(--surface);border:2px solid var(--bar);transform:translateX(-50%)}
.track[aria-label*="归档"] {opacity:.75}

// tiles. Red is the sideways bend and green the vertical one, 128 none.
function tilePixels(radius, bezel, corner, power) {
  const size = Math.max(1, Math.ceil(Math.max(radius, bezel)));
  const probe = size * 2 + 1;
  const geometry = { bezel, radius, corner, power };
  return {
    size,
    tiles: lensLayout(probe, probe, size).map(([left, top, w, h]) => {
      const data = new Uint8ClampedArray(w * h * 4);
      for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
          const [dx, dy] = rimDisplacement(left + x + 0.5, top + y + 0.5, probe, probe, geometry);
          const i = (y * w + x) * 4;
          data[i] = Math.round(128 + dx * 127);
          data[i + 1] = Math.round(128 + dy * 127);
          data[i + 2] = 128;
          data[i + 3] = 255;
        }
      }
      return { width: w, height: h, data };
    }),
  };
}

// Tiles for one rim, as decoded PNG data URLs: a filter whose images are
// still decoding draws without its blur, so no surface points at one early.
const tileCache = new Map();
const TILE_CACHE_MAX = 48;

function lensTiles(radius, bezel, corner, power) {
  const key = `${radius}:${bezel}:${corner.toFixed(3)}:${power.toFixed(3)}`;
  let entry = tileCache.get(key);
  if (entry) {
    // Most recently used last.
    tileCache.delete(key);
    tileCache.set(key, entry);
    return entry;
  }
  const { size, tiles } = tilePixels(radius, bezel, corner, power);
  // Encoded with toBlob, which compresses off the main thread, and kept as
  // object URLs for as long as the page lives (a rim's tiles are small).
  entry = Promise.all(tiles.map((tile) => {
    const canvas = document.createElement('canvas');
    canvas.width = tile.width;
    canvas.height = tile.height;
    const context = canvas.getContext('2d');
    const image = context.createImageData(tile.width, tile.height);
    image.data.set(tile.data);
    context.putImageData(image, 0, 0);
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/png')).then(async (blob) => {
      const url = blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png');
      const decoded = new Image();
      decoded.src = url;
      await decoded.decode().catch(() => {});
      return url;
    });
  })).then((urls) => ({ size, urls }));
  tileCache.set(key, entry);
  while (tileCache.size > TILE_CACHE_MAX) tileCache.delete(tileCache.keys().next().value);
  return entry;
}

function node(tag, attrs, parent) {
  const el = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);
  parent?.append(el);

// by it once, or once per color channel by its own share of the bend, the
// three added back together (screen on single channels is a sum). Each

function placeFilter(lens, width, height) {
  lens.filter.setAttribute('width', width);
  lens.filter.setAttribute('height', height);
  lensLayout(width, height, lens.tiles.size).forEach(([x, y, w, h], index) => {
    const piece = lens.pieces[index];
    piece.setAttribute('x', x);
    piece.setAttribute('y', y);
    piece.setAttribute('width', w);
    piece.setAttribute('height', h);
  });

        placeFilter(current.lens, width, height);
        current.width = width;
        current.height = height;
      }
      setScale(current.lens, bezel);
      return;
    }
    const now = performance.now();
    const settling = current && now - lastChange < SETTLE_MS;
    lastChange = now;
    if (settling) {
      if (current.width !== width || current.height !== height) {
        placeFilter(current.lens, width, height);
        current.width = width;
        current.height = height;

      settle = setTimeout(schedule, SETTLE_MS);

    // the new size, so no part of the surface goes without it.
    if (current && (current.width !== width || current.height !== height)) {
      placeFilter(current.lens, width, height);
      current.width = width;
      current.height = height;

    if (previous) requestAnimationFrame(() => requestAnimationFrame(() => previous.lens.host.remove()));

  }

    cancelAnimationFrame(frame);
    clearTimeout(settle);
    clear();
  }

function sampleSeries(from,to,models,read) {
  if (from>to) return [];
  const span=Math.round((to-from)/DAY);
  const step=Math.max(1,Math.ceil(span/430));
  const dates=new Set([from,to]);
  for (let offset=0;offset<span;offset+=step) dates.add(from+offset*DAY);
  const include=date=>{
    if(date>=from && date<=to) dates.add(date);
  };
  for (const model of models) {
    for (const offset of [-1,0,1,2,3,7,14,30]) include(model.start+offset*DAY);
    for (const event of model.events) {
      include(event.date-DAY);
      include(event.date);
    }
  }
  return [...dates].sort((a,b)=>a-b).map(date=>({date,value:read(date)}));
}

function overviewSeries() {
  const end=stamp(asOf);
  const eligible=catalog.filter(item=>item.point);
  const earliest=eligible.reduce((date,item)=>Math.min(date,item.model.start),end);
  const start=state.overviewRange==='all' ? earliest : end-Number(state.overviewRange)*DAY;
  const portfolio=state.chartMode==='portfolio';
  const purchases=new Map();
  let series;
  if (portfolio) {
    const models=active.map(item=>item.model);
    const first=models.reduce((date,model)=>Math.min(date,model.start),Infinity);
    const from=Math.max(start,first);
    const read=portfolioDailyAt;
    series=[{device:{id:'portfolio',name:'在用组合'},from,to:end,read,archived:false,points:sampleSeries(from,end,models,read)}];
    for(const {device,model} of active){
      if(!device.purchasePrice || model.start<start || model.start>end) continue;
      if(!purchases.has(model.start)) purchases.set(model.start,[]);
      purchases.get(model.start).push(device);
    }
  } else {
    series=catalog.map(({device,model,point})=>{
      const archived=device.status==='归档';
      const last=point ? model.events.reduce((date,event)=>
        event.kind==='recovery' && event.date<=end ? Math.max(date,event.date) : date,point.last) : -Infinity;
      const from=point?Math.max(start,model.start):Infinity;
      const read=date=>evaluate(model,date).daily;
      return {device,point,read,archived,from,to:last,points:sampleSeries(from,last,model?[model]:[],read)};
    });
    series.sort((a,b)=>Number(a.archived)-Number(b.archived) || (b.point?.daily ?? -1)-(a.point?.daily ?? -1));
  }
  series.forEach((item,index)=>{
    item.number=index+1;
  });
  return {start,end,series,portfolio,purchases};
}

  const magnitude=Math.abs(value);
  if (magnitude<.0005) return '¥0.00';
  return (value<0?'−':'+') + '¥' + (magnitude<.01 ? magnitude.toFixed(3) : decimal.format(magnitude));
}

function overviewChart() {
  const {start,end,series,portfolio,purchases}=comparisonModel=overviewSeries();
  if (!portfolio && !series.some(item=>item.device.id===state.compareDevice && item.points.length)) {
    state.compareDevice=null;
    state.focusOnly=false;
  }
  const count=series.filter(item=>item.points.length).length;
  const context=portfolio ? active.length+' 台在用设备' :
    count===series.length ? count+' 台设备' : count+' / '+series.length+' 台有区间记录';
  const controls='<div class="comparison-toolbar"><div class="chart-context"><span class="comparison-count">'+context+
    '</span><output aria-live="polite"></output></div><div class="chart-controls">'+
    segment('图表时间范围','overviewRange',[['30','近 30 天'],['365','近一年'],['all','全部历史']],state.overviewRange)+'</div></div>';
  const legend=series.map(item=>{
    const {device,archived,points}=item;
    const visible=points.length>0;
    const attributes=portfolio?'':' data-series="'+esc(device.id)+'" aria-pressed="'+(device.id===state.compareDevice)+
      '" title="'+esc(device.name+'，点按高亮曲线')+'"';
    const tag=portfolio?'div':'button';
    return '<'+tag+' class="series-item'+(portfolio?' portfolio-series':'')+(archived?' archived-series':'')+'"'+
      attributes+(visible?'':' hidden')+'><span class="series-name" translate="no">'+esc(device.name)+
      '</span><span class="series-readout"><span class="series-value"></span>'+
      (archived?'<span class="series-archived">归档</span>':'')+'</span></'+tag+'>';
  }).join('');

  const crossings=count && !portfolio?'<div class="compact-crossings" role="group" aria-label="日期对应的设备读数" hidden>'+
    series.filter(item=>item.points.length).map(({device,archived})=>
      '<button class="crossing-row" type="button" aria-pressed="false" data-crossing="'+esc(device.id)+'"'+
      (archived?' data-archived':'')+' title="'+esc(device.name)+'" hidden><span class="crossing-name" translate="no">'+
      esc(device.name)+'</span><strong></strong></button>').join('')+'</div>':'';
  const purchaseMarkers=portfolio?'<div class="purchase-markers" role="group" aria-label="购入事件">'+[...purchases].map(([date,devices])=>{
    const name=devices.length===1?devices[0].name:devices[0].name+' 等 '+devices.length+' 台';
    const description=devices.map(device=>device.name+' '+money(device.purchasePrice)).join('、');
    const label=dateAt(date)+' 购入 '+description;
    return '<button class="purchase-marker" type="button" data-purchase-date="'+date+'" aria-label="'+esc(label)+
      '" title="'+esc(label)+'" aria-pressed="false"><span class="purchase-label" aria-hidden="true">'+esc(name)+'</span></button>';
  }).join('')+'</div>':'';

  return '<div class="device-comparison">'+controls+
    (count?'<figure class="comparison-figure"><div class="comparison-stage'+(portfolio?' portfolio-stage':'')+'" style="--curves:'+count+'">'+
      '<canvas class="comparison-canvas" tabindex="0" aria-label="日均成本走势，方向键可逐日查看，Shift 加方向键可按周查看" aria-describedby="comparison-caption"></canvas>'+
      '<div class="series-list"'+(portfolio?'':' role="group" aria-label="设备曲线和读数"')+'>'+legend+'</div>'+crossings+purchaseMarkers+'</div>'+
      '<figcaption class="plot-footer" id="comparison-caption"><span>'+dateAt(start)+'</span><span class="axis-center">'+
      '<span class="axis-unit"></span><output class="compact-date" aria-label="查看日期" aria-live="polite"></output></span><span>'+
      dateAt(end)+'</span></figcaption></figure>':'<p class="empty">这个区间没有可绘制的记录</p>')+
    (portfolio?'':'<div class="series-actions" hidden><button class="quiet series-zoom" aria-pressed="false">只看这台</button>'+
      '<button class="quiet series-reset">取消高亮</button></div>')+'</div>';
}

function comparisonScale(series) {
  let low=Infinity,high=-Infinity,typical=0;
  for (const item of series) {
    if (!item.points.length) continue;
    const last=Math.abs(item.points.at(-1).value);
    typical=Math.max(typical,last);
    for (const point of item.points) {
      const value=point.value;
      low=Math.min(low,value);
      high=Math.max(high,value);
    }
  }

  const peak=Math.max(Math.abs(low),Math.abs(high));
  if (peak>=100 && (peak>12*Math.max(typical,1) || high-low>1000)) {
    // Keep ordinary movements readable even if a newly purchased device is
    // shedding thousands per day as its first few days are amortized.
    const project=value=>Math.asinh(value/.5);
    const min=project(low),max=project(high);
    const margin=(max-min)*.055;
    const ticks=[0];
    for (let value=.1;value<Math.max(10,peak*10) && Number.isFinite(value);value*=10) {
      if(value<=high) ticks.push(value);
      if(-value>=low) ticks.push(-value);
    }
    return {project,min:min-margin,max:max+margin,ticks:ticks.sort((a,b)=>b-a),decimals:1,compressed:true};
  }

  const realSpan=high-low;
  const epsilon=Math.max(Math.abs(high)*.025,.001);
  if (realSpan<=epsilon*1e-5) {
    low=low<0?low-epsilon:Math.max(0,low-epsilon);
    high+=epsilon;
  }
  const rawStep=(high-low)/4;
  const unit=10**Math.floor(Math.log10(rawStep));
  const step=unit*([1,2,2.5,5,10].find(value=>value>=rawStep/unit) ?? 10);
  const first=Math.floor(low/step+1e-9),last=Math.ceil(high/step-1e-9);
  const decimals=Math.max(0,Math.min(6,Math.ceil(-Math.log10(step))+(Math.abs(step/unit-2.5)<1e-9?1:0)));
  const ticks=Array.from({length:last-first+1},(_,index)=>(last-index)*step);
  return {project:value=>value,min:(first-.12)*step,max:(last+.12)*step,ticks,decimals,compressed:false};
}

function chartTicks(start,end,width) {
  const target=width<495?4:7;
  const days=Math.round((end-start)/DAY);
  const ticks=[];
  if(days>730){
    const firstYear=new Date(start).getUTCFullYear(),lastYear=new Date(end).getUTCFullYear();
    const step=Math.max(1,Math.ceil((lastYear-firstYear)/target));
    for(let year=firstYear+step;year<=lastYear;year+=step) ticks.push({date:Date.UTC(year,0,1),label:String(year)});
  } else if(days>7) {
    for(let index=1;index<target;index++){
      const date=start+Math.round(days*index/target)*DAY;
      ticks.push({date,label:dateAt(date).slice(5)});
    }
  }
  return ticks;
}

function spaceChartLabels(labels,top,bottom,gap) {
  labels.sort((a,b)=>a.anchorY-b.anchorY || a.item.number-b.item.number);
  let next=top+gap/2;
  for (const label of labels) {
    label.y=Math.max(label.anchorY,next);
    next=label.y+gap;
  }
  next=bottom-gap/2;
  for(let i=labels.length-1;i>=0;i--){
    labels[i].y=Math.min(labels[i].y,next);
    next=labels[i].y-gap;
  }
  return labels;
}

function mountComparison() {
  const figure=main.querySelector('.device-comparison');
  const canvas=figure?.querySelector('canvas');
  if(!canvas || !comparisonModel) return;
  const {start,end,series,portfolio}=comparisonModel;
  const ctx=canvas.getContext('2d');
  const output=figure.querySelector('.chart-context output'),axisUnit=figure.querySelector('.axis-unit');
  const compactDate=figure.querySelector('.compact-date');
  const crossings=figure.querySelector('.compact-crossings');
  const crossingRows=new Map([...(crossings?.children??[])].map(row=>[row.dataset.crossing,row]));
  const purchaseButtons=[...figure.querySelectorAll('[data-purchase-date]')];
  const context=figure.querySelector('.chart-context');
  const rail=figure.querySelector('.series-list'),actions=figure.querySelector('.series-actions');
  const reset=figure.querySelector('.series-reset'),zoom=figure.querySelector('.series-zoom');
  const rows=[...rail.children],valueLabels=rows.map(row=>row.querySelector('.series-value'));
  const rowByItem=new Map(series.map((item,index)=>[item,rows[index]]));
  const showId=()=>portfolio?null:(state.focusOnly?state.compareDevice:(hovered||state.compareDevice));
  const seriesById=id=>series.find(item=>item.device.id===id);
  const scaleForView=()=>comparisonScale(!portfolio && state.focusOnly && state.compareDevice ?
    series.filter(item=>item.device.id===state.compareDevice):series);
  let pointerDate=null,hovered=null,chartHover=false,layout,frame=0,scale=scaleForView();
  let touchPointer=null,pressedPurchase=null,hoveredPurchase=null,dateActive=false;
  const activePurchase=()=>hoveredPurchase??pressedPurchase;

  function pointValue(item,date) {
    return date>=item.from && date<=item.to ? item.read(date) : undefined;
  }

  function renderedY(item,date,y) {
    const points=item.points;
    if(!points.length || date<points[0].date || date>points.at(-1).date) return undefined;
    let low=0,high=points.length-1;
    while(high-low>1){
      const middle=Math.floor((low+high)/2);
      if(points[middle].date>date) high=middle;
      else low=middle;
    }
    const from=points[low],to=points[high];
    const first=y(from.value);
    if(from.date===to.date) return first;
    return first+(y(to.value)-first)*(date-from.date)/(to.date-from.date);
  }

  function visibleAt(date) {
    return series.flatMap(item=>{
      if(!item.points.length || (state.focusOnly && !portfolio && item.device.id!==state.compareDevice)) return [];
      const value=pointValue(item,date);
      return value===undefined?[]:[{item,value}];
    });
  }

  function positionCrossings(visible,px,y,tone,fontFamily) {
    const {left,right,top,bottom}=layout;
    const useRight=right-px>=px-left;
    const edge=useRight?px+7:px-7;
    const available=useRight?right-edge:edge-left;
    const gap=Math.min(18,(bottom-top)/Math.max(1,visible.length));
    const labels=spaceChartLabels(visible.map(entry=>({...entry,anchorY:renderedY(entry.item,pointerDate,y)})),top,bottom,gap);
    const ids=new Set(labels.map(({item})=>item.device.id));
    for(const [id,row] of crossingRows) row.hidden=!ids.has(id);
    for(const {item,value,anchorY,y:labelY} of labels){
      const row=crossingRows.get(item.device.id);
      const selected=item.device.id===showId();
      row.toggleAttribute('data-highlighted',selected);
      row.setAttribute('aria-pressed',String(item.device.id===state.compareDevice));
      const amount=row.querySelector('strong'), label=costLabel(value);
      ctx.font='500 11px '+fontFamily;
      const nameWidth=ctx.measureText(item.device.name).width;
      ctx.font='620 11px '+fontFamily;
      const amountWidth=Math.max(ctx.measureText(label).width,ctx.measureText(label.replace(/\d/g,'0')).width);
      const tagWidth=Math.min(available,Math.ceil(nameWidth+amountWidth)+14);
      row.style.setProperty('--tag-x',(useRight?edge:edge-tagWidth)+'px');
      row.style.setProperty('--tag-y',labelY+'px');
      row.style.setProperty('--tag-width',tagWidth+'px');
      row.style.setProperty('--tag-height',Math.max(11,gap-2)+'px');
      if(amount.textContent!==label) amount.textContent=label;
      row.title=item.device.name+' · '+label+' / 天';
      ctx.strokeStyle=tone(selected?'--cost-color':item.archived?'--series-archived':'--series');
      ctx.globalAlpha=.72;ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(px+(useRight?3:-3),anchorY);ctx.lineTo(edge,labelY);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function positionPurchases(item,x,y,drawWidth) {
    if(!item) return;
    const occupied=[];
    const current=activePurchase();
    const buttons=current?[current,...purchaseButtons.filter(button=>button!==current)]:purchaseButtons;
    for(const button of buttons){
      const date=Number(button.dataset.purchaseDate);
      const px=x(date),py=y(item.read(date));
      button.style.left=px+'px';
      button.style.top=py+'px';
      const label=button.firstElementChild;
      const width=Math.min(174,drawWidth-12,Math.ceil(ctx.measureText(label.textContent).width)+18);
      const above=Math.max(1,py-25),below=Math.min(layout.bottom-21,py+8);
      const candidates=[[px+8,above],[px-width-8,above],[px+8,below],[px-width-8,below]];
      const place=candidates.find(([lx,ly])=>lx>=layout.left && lx+width<=layout.right &&
        occupied.every(([ox,oy,ow])=>lx+width+4<=ox||ox+ow+4<=lx||ly+23<=oy||oy+23<=ly));
      button.toggleAttribute('data-label',Boolean(place));
      if(place){
        const [lx,ly]=place;
        label.style.width=width+'px';
        label.style.left=lx-px+10+'px';
        label.style.top=ly-py+10+'px';
        occupied.push([lx,ly,width]);
      }
    }
  }

  function updateLabels() {
    const activeId=showId();
    const chosen=seriesById(activeId) || (portfolio?series[0]:null);
    const selectedValue=chosen && pointerDate!==null ? pointValue(chosen,pointerDate) : undefined;
    if(actions) actions.hidden=!state.compareDevice;
    if(zoom){
      zoom.hidden=!state.compareDevice;
      zoom.setAttribute('aria-pressed',String(state.focusOnly));
      zoom.textContent=state.focusOnly?'恢复全部曲线':'只看这台';
    }
    context.toggleAttribute('data-inspecting',Boolean(activeId)||pointerDate!==null);
    const lastLabel='区间末值';
    const event=activePurchase();
    context.toggleAttribute('data-purchase',Boolean(event));
    axisUnit.textContent=(scale.compressed?'压缩刻度':'线性刻度')+' · 元 / 天';
    output.textContent=event?.getAttribute('aria-label') ?? (pointerDate===null ?
      (activeId?chosen.device.name+(state.focusOnly?' · 仅显示这台':' · '+lastLabel):lastLabel) :
      dateAt(pointerDate)+(selectedValue===undefined ? ' · 日均成本' :
        ' · '+chosen.device.name+' '+costLabel(selectedValue)+' / 天'));
    output.title=output.textContent;
    const dateText=dateActive && pointerDate!==null?dateAt(pointerDate):'';
    if(compactDate.value!==dateText) compactDate.value=dateText;
    for(let i=0;i<rows.length;i++){
      const row=rows[i],item=series[i];
      if(!portfolio){
        row.setAttribute('aria-pressed',String(item.device.id===state.compareDevice));
        row.toggleAttribute('data-highlighted',item.device.id===activeId);
      }
      row.hidden=!item.points.length || (!portfolio && state.focusOnly && item.device.id!==state.compareDevice);
      const value=pointerDate===null?item.points.at(-1)?.value:pointValue(item,pointerDate);
      const text=value===undefined?'—':costLabel(value);
      valueLabels[i].textContent=text;
      if(!portfolio) row.setAttribute('aria-label',item.device.name+(item.archived?'，归档':'')+'，'+
        (value===undefined?'当日无记录':text+' / 天')+'，点按高亮曲线');
    }
  }

  function draw() {
    frame=0;
    const {width,height}=canvas.getBoundingClientRect();
    if(!width || !height) return;
    const dpr=Math.min(devicePixelRatio||1,3);
    const pixelWidth=Math.round(width*dpr),pixelHeight=Math.round(height*dpr);
    if(canvas.width!==pixelWidth || canvas.height!==pixelHeight){
      canvas.width=pixelWidth;canvas.height=pixelHeight;
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,width,height);
    const styles=getComputedStyle(document.documentElement);
    const tone=name=>styles.getPropertyValue(name).trim();
    const compact=width<620;
    const left=compact?39:52,right=compact?width-9:width-rail.clientWidth-12;
    const top=13,bottom=height-25,duration=Math.max(DAY,end-start);
    const x=date=>left+(date-start)/duration*(right-left);
    const y=value=>bottom-(scale.project(value)-scale.min)/(scale.max-scale.min)*(bottom-top);
    layout={compact,left,right,top,bottom,x,y,labels:[]};
    ctx.font='11px -apple-system, sans-serif';
    ctx.textBaseline='middle';ctx.textAlign='right';
    let lastTick=-Infinity;
    for(const value of scale.ticks){
      const py=y(value);
      if(py-lastTick<18 && value!==0) continue;
      if(scale.compressed && value!==0 && Math.abs(py-y(0))<18) continue;
      lastTick=py;
      ctx.strokeStyle=tone('--grid');ctx.lineWidth=1;
      ctx.setLineDash(value===0?[]:[2,4]);
      ctx.beginPath();ctx.moveTo(left,py);ctx.lineTo(right,py);ctx.stroke();
      ctx.fillStyle=tone('--muted');
      const absolute=Math.abs(value);
      const label=absolute>=1000 ? Number((value/1000).toPrecision(3))+'k' :
        (Object.is(value,-0)?0:value).toFixed(scale.decimals).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
      ctx.fillText(label,left-7,py);
    }

    ctx.strokeStyle=tone('--grid');ctx.fillStyle=tone('--muted');
    ctx.setLineDash([2,5]);ctx.textAlign='center';
    for(const {date,label} of chartTicks(start,end,right-left)){
      const px=x(date);
      if(px<left+12 || px>right-12) continue;
      ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px,bottom);ctx.stroke();
      ctx.fillText(label,px,height-8);
    }
    ctx.setLineDash([]);

    const focused=showId();
    const visible=series.filter(item=>item.points.length && (portfolio||!state.focusOnly||item.device.id===state.compareDevice));
    const lineTone=item=>tone(portfolio||item.device.id===focused?'--cost-color':item.archived?'--series-archived':'--series');
    const alpha=item=>portfolio||item.device.id===focused?1:focused?.29:item.archived?.74:.88;
    const drawLine=item=>{
      const selected=portfolio||item.device.id===focused;
      ctx.strokeStyle=lineTone(item);ctx.fillStyle=ctx.strokeStyle;
      ctx.globalAlpha=alpha(item);ctx.lineWidth=selected?2.65:1.45;
      ctx.lineJoin='round';ctx.lineCap='round';
      ctx.setLineDash(item.archived?[5,4]:[]);
      ctx.beginPath();
      item.points.forEach(({date,value},index)=>{
        const px=x(date),py=y(value);
        if(index) ctx.lineTo(px,py);
        else ctx.moveTo(px,py);
      });
      ctx.stroke();ctx.setLineDash([]);
      const point=item.points.at(-1);
      ctx.beginPath();ctx.arc(x(point.date),y(point.value),selected?3.4:2.2,0,2*Math.PI);ctx.fill();
      ctx.globalAlpha=1;
    };

    if(pointerDate!==null && chartHover){
      const px=x(pointerDate);
      ctx.strokeStyle=tone('--muted');ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px,bottom);ctx.stroke();
    }
    visible.filter(item=>item.device.id!==focused).forEach(drawLine);
    const chosen=visible.find(item=>item.device.id===focused) || (portfolio?visible[0]:null);
    if(chosen && !portfolio) drawLine(chosen);
    const following=Boolean(compact && crossings && pointerDate!==null && chartHover);
    if(crossings) crossings.hidden=!following;
    if(pointerDate!==null && chartHover){
      const readings=following?visibleAt(pointerDate):[];
      const intersecting=following?readings.map(({item})=>item):
        chosen && pointValue(chosen,pointerDate)!==undefined?[chosen]:[];
      if(following) positionCrossings(readings,x(pointerDate),y,tone,styles.fontFamily);
      intersecting.sort((a,b)=>Number(a===chosen)-Number(b===chosen));
      for(const item of intersecting){
        const py=renderedY(item,pointerDate,y);
        if(py===undefined) continue;
        ctx.fillStyle=lineTone(item);ctx.strokeStyle=tone('--pane-solid');ctx.lineWidth=1.35;
        ctx.beginPath();ctx.arc(x(pointerDate),py,item===chosen?4.8:3.65,0,2*Math.PI);ctx.fill();ctx.stroke();
      }
    }
    if(portfolio) positionPurchases(visible[0],x,y,width);

    if(compact) return;
    const labelGap=23;
    layout.labels=spaceChartLabels(visible.map(item=>{
      const endPoint=item.points.at(-1);
      return {item,anchorX:x(endPoint.date),anchorY:y(endPoint.value)};
    }),top,bottom,labelGap);
    for(const {item,anchorX,anchorY,y:labelY} of layout.labels){
      const selected=portfolio||item.device.id===focused;
      const row=rowByItem.get(item);
      row.style.setProperty('--label-y',labelY+'px');
      row.style.setProperty('--series-opacity',selected?1:focused?.63:1);
      const targetX=right+11;
      ctx.strokeStyle=lineTone(item);
      ctx.globalAlpha=selected?.8:focused?.24:.50;
      ctx.lineWidth=1;
      if(item.archived) ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(anchorX+3,anchorY);
      ctx.lineTo(right+3,anchorY);ctx.lineTo(targetX,labelY);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.globalAlpha=1;
  }

  const invalidate=()=>{
    if(!frame) frame=requestAnimationFrame(draw);
  };
  function inspect(event) {
    if(!layout || (event.pointerType==='touch' && event.pointerId!==touchPointer)) return;
    const rect=canvas.getBoundingClientRect();
    if(portfolio && pressedPurchase){
      pressedPurchase.setAttribute('aria-pressed','false');
      pressedPurchase=null;
    }
    const px=event.clientX-rect.left,py=event.clientY-rect.top;
    if(!layout.compact && px>layout.right+3){
      const label=layout.labels.find(label=>Math.abs(label.y-py)<8.5);
      hovered=label?.item.device.id??null;
      pointerDate=label?.item.to??null;
      chartHover=false;
    } else {
      const portion=(px-layout.left)/(layout.right-layout.left);
      const days=Math.round((end-start)/DAY);
      pointerDate=start+Math.min(days,Math.max(0,Math.round(portion*days)))*DAY;
      chartHover=true;
      hovered=null;
      if(!portfolio && !state.focusOnly && (!layout.compact || event.pointerType!=='touch')){
        let distance=event.pointerType==='touch'?24:17;
        const moment=start+Math.max(0,Math.min(1,portion))*(end-start);
        for(const item of series){
          const curve=renderedY(item,moment,layout.y);
          if(curve===undefined) continue;
          const offset=Math.abs(py-curve);
          if(offset<distance){distance=offset;hovered=item.device.id}
        }
      }
    }
    dateActive=chartHover;updateLabels();invalidate();
  }
  const clear=()=>{
    pointerDate=null;hovered=null;chartHover=false;dateActive=false;
    updateLabels();invalidate();
  };
  canvas.addEventListener('pointermove',inspect);
  canvas.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch'){
      if(touchPointer!==null) return;
      touchPointer=event.pointerId;
      canvas.setPointerCapture(touchPointer);
    }
    inspect(event);
  });
  canvas.addEventListener('pointerup',event=>{
    if(event.pointerId!==touchPointer) return;
    touchPointer=null;dateActive=false;updateLabels();
  });
  canvas.addEventListener('pointerleave',event=>{if(event.pointerType!=='touch') clear()});
  canvas.addEventListener('pointercancel',event=>{
    if(event.pointerId===touchPointer) touchPointer=null;
    clear();
  });
  canvas.addEventListener('blur',event=>{
    if(!crossings?.contains(event.relatedTarget)) clear();
    else {dateActive=false;updateLabels()}
  });
  canvas.addEventListener('focus',()=>{
    if(pointerDate===null){pointerDate=end;chartHover=true;updateLabels();invalidate()}
  });
  canvas.addEventListener('keydown',event=>{
    const date=pointerDate??end;
    const jump=(event.shiftKey?7:1)*DAY;
    const moves={Home:start,End:end,ArrowLeft:date-jump,ArrowRight:date+jump};
    if(!Object.hasOwn(moves,event.key)) return;
    event.preventDefault();
    pointerDate=Math.min(end,Math.max(start,moves[event.key]));
    hovered=null;chartHover=true;dateActive=true;updateLabels();invalidate();
  });
  if(portfolio){
    for(const button of purchaseButtons){
      const preview=current=>{hoveredPurchase=current;updateLabels();invalidate()};
      button.addEventListener('pointerenter',()=>preview(button));
      button.addEventListener('pointerleave',()=>preview(null));
      button.addEventListener('focus',()=>preview(button));
      button.addEventListener('blur',()=>preview(null));
      button.addEventListener('click',()=>{
        if(pressedPurchase) pressedPurchase.setAttribute('aria-pressed','false');
        pressedPurchase=pressedPurchase===button?null:button;
        if(pressedPurchase) pressedPurchase.setAttribute('aria-pressed','true');
        preview(pressedPurchase);
      });
    }
  } else {
    for(const row of rows){
      if(!seriesById(row.dataset.series)?.points.length) continue;
      row.addEventListener('pointerenter',()=>{
        if(state.focusOnly) return;
        hovered=row.dataset.series;updateLabels();invalidate();
      });
      row.addEventListener('pointerleave',()=>{
        if(hovered===row.dataset.series){hovered=null;updateLabels();invalidate()}
      });
    }
    figure.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if(!button || (!button.dataset.series && !button.dataset.crossing && button!==reset && button!==zoom)) return;
      if(button===zoom) state.focusOnly=!state.focusOnly;
      else {
        const id=button.dataset.series??button.dataset.crossing;
        state.compareDevice=id && id!==state.compareDevice?id:null;
        if(!state.compareDevice) state.focusOnly=false;
      }
      hovered=null;
      if(!button.dataset.crossing){pointerDate=null;chartHover=false;dateActive=false}
      if(button===reset) rows.find(item=>!item.hidden)?.focus({preventScroll:true});
      scale=scaleForView();updateLabels();invalidate();
    });
  }
  const observer=new ResizeObserver(invalidate);
  observer.observe(canvas);
  plotCleanups.push(()=>{observer.disconnect();cancelAnimationFrame(frame)});
  updateLabels();
  draw();
}

  });
  yearSpend = yearRows.reduce((sum,item) => sum + item.value,0);

function syncResults() {
  const query = state.query.trim().toLowerCase();
  const items = catalog.filter(item => {
    const {device} = item;
    const statusMatch = state.status === '全部' || (state.status === '在用' ? active.includes(item) : statusFor(item) === state.status);
    const alias = Object.hasOwn(brandAliases,device.brand) ? brandAliases[device.brand] : '';
    return statusMatch && (state.category === '全部' || device.category === state.category) &&
      (state.brand==='*' || brandKey(device)===state.brand) &&
      (!query || [device.name,brandLabel(device.brand),alias,device.category,device.tags,device.notes,device.channel,device.additionalDetail].join(' ').toLowerCase().includes(query));
  });
  items.sort((a,b) => {
    if (state.sort === 'daily') return (b.point?.daily ?? -Infinity) - (a.point?.daily ?? -Infinity);
    if (state.sort === 'name') return a.device.name.localeCompare(b.device.name,'zh-CN');
    return b.device.purchaseDate.localeCompare(a.device.purchaseDate);
  });
  const count=Object.keys(collectionDefaults).filter(key=>state[key]!==collectionDefaults[key]).length;
  const filterCount=document.querySelector('.filter-count');
  filterCount.hidden=count===0;
  filterCount.textContent=count;

  document.querySelector('#results').innerHTML = !items.length ? '<div class="card empty">没有符合条件的设备</div>' :
    state.mode==='timeline'?timeline(items):state.mode==='brand'?
      '<div class="brand-groups">'+groupByBrand(items).map(group=>
        '<section class="card device-list brand-group"><h2>'+esc(group.label)+'<span>'+group.items.length+' 件</span></h2>'+
        group.items.map(item=>deviceLine(item)).join('')+'</section>').join('')+'</div>':
      '<div class="card device-list">'+items.map(item=>deviceLine(item)).join('')+'</div>';
}

function timeline(items) {
  const end = stamp(asOf);
  const earliest = Math.min(end,...catalog.filter(item => item.point).map(item => item.model.start));
  const yearStart = Number(iso(earliest).slice(0,4));
  const yearEnd = Number(asOf.slice(0,4));
  const start = stamp(yearStart + '-01-01');
  const percent = date => Math.max(0,Math.min(100,100*(date-start)/Math.max(DAY,end-start)));
  const step = Math.max(1,Math.ceil((yearEnd-yearStart+1)/6));
  const years = [];
  for(let year=yearStart;year<=yearEnd;year+=step) years.push(year);
  const ticks = years.map(year => [year,percent(stamp(year + '-01-01'))]);
  const grid = ticks.map(([,left]) => '<span class="track-guide" style="left:' + left + '%"></span>').join('');
  return '<div class="card timeline"><div class="timeline-axis"><span>使用时间 · 刻度为追加或回收</span><span class="axis-years">' +
    ticks.map(([year,left]) => '<span style="left:clamp(0px,' + left + '%,calc(100% - 30px))">' + year + '</span>').join('') + '</span><span>日均 / 天</span></div>' +
    items.map(({device,point,model}) => {
      const eventDates = !point ? [] : [...new Set(model.events.filter(event => event.kind !== 'purchase')
        .map(event => Number.isFinite(event.date) ? event.date : point.last).filter(date => date <= end))];
      const track = point ? '<span class="track-fill" style="left:' + percent(model.start) + '%;width:' +
        (percent(point.last) - percent(model.start)) + '%"></span>' +
        eventDates.map(date => '<span class="track-point" style="left:' + percent(date) + '%"></span>').join('') : '';
      return '<div class="timeline-row"><button class="timeline-label" data-device="' + esc(device.id) + '">' + deviceIcon(device) +
        '<span><span class="device-name">' + esc(device.name) + '</span><span class="device-meta">' +
        statusFor({device,point,model}) + ' · ' + displayDate(device.purchaseDate) + '</span></span></button><button class="track" data-device="' +
        esc(device.id) + '" aria-label="' + esc(device.name + ' ' + statusFor({device,point,model}) + '，查看时间线和支出明细') +
        '">' + grid + track +
        '</button><span class="timeline-money">' + trackLabel(point) + '</span></div>';
    }).join('') + '</div>';
}

function mountPlots(container) {
  container.querySelectorAll('[data-plot]').forEach(canvas => {
    const {points,compressed} = plots.get(canvas.dataset.plot);
    const output = canvas.nextElementSibling;
    const ctx = canvas.getContext('2d');
    const transform = compressed ? value => Math.asinh(value) : value => value;
    const untransform = compressed ? value => Math.sinh(value) : value => value;
    const values = points.map(point => transform(point.value));
    const min = Math.min(...values), max = Math.max(...values);
    const pad = Math.max((max-min)*.13,compressed ? .04 : .025);
    const low = min >= 0 ? Math.max(0,min-pad) : min-pad;
    const high = max+pad;
    const interval = (high-low)/4;
    const order = 10 ** Math.floor(Math.log10(interval));
    const step = order * [1,2,2.5,5,10].find(value=>value>=interval/order);
    const ticks = compressed ? Array.from({length:5},(_,i)=>high-i*(high-low)/4) :
      Array.from({length:5},(_,i)=>(Math.floor((high+step*.01)/step)-i)*step).filter(value=>value>=low-step*.001);
    let index = -1;
    let plotRight = 0;
    const first = points[0].date, duration = Math.max(1,points.at(-1).date-first);
    const x = i => 7+(plotRight-7)*(points[i].date-first)/duration;

    function draw() {
      const {width,height} = canvas.getBoundingClientRect();
      if (!width || !height) return;
      const ratio = Math.min(devicePixelRatio || 1,3);
      canvas.width = Math.round(width*ratio);
      canvas.height = Math.round(height*ratio);
      ctx.setTransform(ratio,0,0,ratio,0,0);
      const styles = getComputedStyle(document.documentElement);
      const accent = styles.getPropertyValue('--cost-color').trim();
      const top = 15, base = height-13;
      plotRight = width-45;
      const y = value => base-(base-top)*(value-low)/(high-low);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textBaseline = 'middle';
      for (const value of ticks) {
        const yPos = y(value);
        ctx.strokeStyle = styles.getPropertyValue('--grid');
        ctx.lineWidth = 1;
        ctx.setLineDash([2,4]);
        ctx.beginPath();
        ctx.moveTo(7,yPos);
        ctx.lineTo(plotRight,yPos);
        ctx.stroke();
        ctx.fillStyle = styles.getPropertyValue('--sub');
        const tick = untransform(value);
        const digits = compressed ? (Math.abs(tick) < 8 ? 1 : 0) : Number.isInteger(step) ? 0 : step >= .1 ? 1 : 2;
        ctx.fillText(Math.abs(tick)>=1000 ? (tick/1000).toFixed(1)+'k' : tick.toFixed(digits),plotRight+8,yPos);
      }
      ctx.strokeStyle=styles.getPropertyValue('--grid');
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(7,base);
      ctx.lineTo(plotRight,base);
      ctx.stroke();
      ctx.setLineDash([]);
      function trace() {
        ctx.beginPath();
        ctx.moveTo(x(0),y(values[0]));
        for(let i=1;i<values.length;i++) ctx.lineTo(x(i),y(values[i]));
      }
      trace();
      ctx.strokeStyle=accent;
      ctx.lineWidth=2.2;
      ctx.lineJoin='round';
      ctx.stroke();
      const marker = index < 0 ? values.length-1 : index;
      const cx=x(marker),cy=y(values[marker]);
      if(index >= 0) {
        ctx.strokeStyle=styles.getPropertyValue('--sub');
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx,top);
        ctx.lineTo(cx,base);
        ctx.stroke();
      }
      ctx.fillStyle=styles.getPropertyValue('--surface');
      ctx.beginPath();
      ctx.arc(cx,cy,6,0,2*Math.PI);
      ctx.fill();
      ctx.fillStyle=accent;
      ctx.beginPath();
      ctx.arc(cx,cy,3.8,0,2*Math.PI);
      ctx.fill();
      output.hidden = index < 0;
      if(index >= 0) {
        output.textContent=dateAt(points[index].date)+' · '+costLabel(points[index].value)+' / 天';
        output.style.left=Math.max(2,Math.min(width-output.offsetWidth-2,cx-output.offsetWidth/2))+'px';
      }
    }

    function pointFromPointer(event) {
      const relative = event.clientX-canvas.getBoundingClientRect().left;
      const target = first + duration*(relative-7)/Math.max(1,plotRight-7);
      const nearest = points.reduce((best,point,i) => Math.abs(point.date-target) < Math.abs(points[best].date-target) ? i : best,0);
      if (index === nearest) return;
      index = nearest;
      draw();
    }
    canvas.addEventListener('pointermove',pointFromPointer);
    canvas.addEventListener('pointerdown',pointFromPointer);
    canvas.addEventListener('pointerleave',() => {index=-1;draw()});
    canvas.addEventListener('focus',() => {index=points.length-1;draw()});
    canvas.addEventListener('blur',() => {index=-1;draw()});
    canvas.addEventListener('keydown',event => {
      const moves = {ArrowLeft:index-1,ArrowRight:index+1,Home:0,End:points.length-1};
      if (!Object.hasOwn(moves,event.key)) return;
      event.preventDefault();
      index=Math.min(points.length-1,Math.max(0,moves[event.key]));
      draw();
    });
    const observer=new ResizeObserver(draw);
    observer.observe(canvas);
    plotCleanups.push(() => observer.disconnect());
    draw();
  });
}

  const target = device.targetDaily > 0 && point ? '<p class="note-text">个人日均目标 '+money(device.targetDaily)+
    ' / 天 · '+(point.daily <= device.targetDaily ? '已达标' : '当前高于目标 '+money(point.daily-device.targetDaily)+' / 天')+'</p>' : '';
  detailDialog.innerHTML='<header class="modal-top"><div class="modal-title">'+deviceIcon(device)+'<div><h2 id="detail-title">'+esc(device.name)+
    '</h2><p>'+device.category+' · '+statusFor(item)+'</p></div></div>'+closeButton('detail')+'</header><div class="modal-body">'+metrics+
    '<section class="card device-cost"><div class="chart-top"><h3>日均成本</h3>'+segment('设备成本区间','detailRange',[['year','近一年'],['life','完整周期']],state.detailRange)+'</div>'+
    curve+recoverySummary+prediction+target+'</section><section class="card"><h3>支出记录</h3>'+(events.length ? events.map(event =>
      '<div class="event"><span>'+esc(event.name)+'<small>'+dateAt(event.date)+'</small></span><strong>'+money(event.amount)+'</strong></div>').join('') :
      '<p class="note-text">该统计日暂无支出记录</p>')+(notes.length ? '<p class="note-text">'+esc(notes.join('。'))+'</p>' : '')+
    '</section><section class="card"><h3>设备档案</h3><dl class="meta-grid">'+metadata.filter(([label,value]) => value || label === '购入日期')
    .map(([label,value,wide])=>'<div'+(wide?' class="wide"':'')+'><dt>'+label+'</dt><dd>'+esc(value || '待补充')+'</dd></div>').join('')+
    '</dl></section><div class="modal-actions"><button class="quiet danger" data-command="delete">删除设备</button><button class="secondary" data-command="edit">编辑设备</button></div></div>';
  mountPlots(detailDialog);

}

function detailCurve(model,point,events) {
  const end = Math.max(point.last,...events.map(event => event.date));
  const start = state.detailRange === 'year' ? Math.max(model.start,end-365*DAY) : model.start;
  const span = Math.round((end-start)/DAY);
  const stride = Math.max(1,Math.ceil(span/255));
  const dates = new Set(events.map(event => event.date).filter(date => date >= start));
  for(let offset=0;offset<span;offset+=stride) dates.add(start+offset*DAY);
  dates.add(end);
  const points=[...dates].sort((a,b)=>a-b).map(date=>({date,value:evaluate(model,date).daily}));
  const ratio = Math.max(...points.map(sample => Math.abs(sample.value))) / Math.max(.05,Math.abs(point.daily));
  const compressed = ratio > 45;
  return showPlot('detail-chart',points,'设备日均成本',compressed ? '纵轴为压缩刻度' : '',compressed);
}

    render();
    settings();
    panel.querySelector('[data-action="theme"][data-value="'+value+'"]').focus();
    return;
  }
  state[action]=value;
  if (action==='detailRange') renderDetail();
  else render();
  if (restoreFocus) (action==='detailRange'?detailDialog:main).querySelector('[data-action="'+action+'"][data-value="'+value+'"]')?.focus({preventScroll:true});
}
document.addEventListener('click',event=>{
  const link=event.target.closest('a[data-view]');
  if (link && event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey) {
    event.preventDefault();
    changeView(link.dataset.view);
    return;
  }
  const button=event.target.closest('button');
  if(!button) return;
  const {device,command,action,close,statusLink,categoryLink,brandLink}=button.dataset;
  if(device) {openDetail(device);return}
  if(action) {updateControl(button,event.detail===0);return}
  if(close) {document.querySelector('#'+close).close();return}
  if(statusLink || categoryLink || brandLink!==undefined) {
    Object.assign(state,{query:'',status:statusLink||'在用',category:categoryLink||'全部',brand:brandLink??'*'});
    changeView('devices');
    return;
  }
  switch(command) {
    case 'settings': settings();break;
    case 'add': editor();break;
    case 'edit': editor(devices.find(item=>item.id===state.detailId));break;
    case 'delete': deleteDevice();break;
    case 'confirm-delete': {
      const error=saveRecords(devices.filter(item=>item.id!==state.detailId),'设备已删除');
      if(error) setError(error);
      else panel.close();
      break;
    }
    case 'reset-date': setDate(localDate());break;
    case 'reset-filters':
      Object.assign(state,collectionDefaults);
      button.form.querySelectorAll('input').forEach(input=>{input.checked=input.value===state[input.name]});
      syncResults();
      break;
    case 'close-filters': {
      const details=button.closest('details');
      details.open=false;
      details.querySelector('summary').focus();
      break;
    }
    case 'import': importPanel();break;
    case 'export': download();break;
    case 'undo': {
      if(!previous) break;
      const error=saveRecords(previous,'操作已撤销');
      if(error) showNotice(error,true);
      else {previous=null;showNotice('操作已撤销')}
      break;
    }
  }
});
function redirectOldStatistics() {
  if(location.hash==='#stats') history.replaceState(null,'','#overview');
}
window.addEventListener('hashchange',()=>{
  redirectOldStatistics();
  const view=viewFromURL();
  if(state.view!==view) changeView(view);
});
document.addEventListener('input',event=>{
  if (event.target.id==='query') {state.query=event.target.value;syncResults()}
});
document.addEventListener('change',event=>{
  const option=event.target;
  if(option.form?.classList.contains('filter-menu') && Object.hasOwn(collectionDefaults,option.name)){
    state[option.name]=option.value;syncResults();
  }
});
document.addEventListener('pointerdown',event=>{
  const filters=main.querySelector('.collection-filters[open]');
  if(filters && !filters.contains(event.target)) filters.open=false;
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape' || panel.open || detailDialog.open) return;
  const filters=main.querySelector('.collection-filters[open]');
  if(filters){
    event.preventDefault();
    filters.open=false;
    filters.querySelector('summary').focus();
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id==='date-form') {
    event.preventDefault();
    setDate(new FormData(event.target).get('date'));
  }
});
detailDialog.addEventListener('close',clearDetailPlot);
for (const dialog of [detailDialog,panel]) {
  dialog.addEventListener('click',event=>{
    if(event.target!==dialog) return;
    const bounds=dialog.getBoundingClientRect();
    if(event.clientX<bounds.left || event.clientX>bounds.right || event.clientY<bounds.top || event.clientY>bounds.bottom)
      dialog.close();
  });
}
document.querySelectorAll('[data-icon]').forEach(element=>element.innerHTML=icon(element.dataset.icon));
const reducedTransparency = matchMedia('(prefers-reduced-transparency: reduce)');
const lenses = [
  glassLens(navigation,{rim:12,edge:.82,power:2.6,dispersion:.06,enabled:!reducedTransparency.matches}),
  glassLens(topBar.querySelector('.top-actions'),{rim:8,edge:.65,power:2.6,dispersion:0,enabled:!reducedTransparency.matches})
];
reducedTransparency.addEventListener('change',event=>{
  lenses.forEach(lens=>lens.update({enabled:!event.matches}));
});
const updateScrollEdge = () => topBar.toggleAttribute('data-scrolled',scrollY > 12);
window.addEventListener('scroll',updateScrollEdge,{passive:true});
updateScrollEdge();
redirectOldStatistics();
render();
if(storedReadError) showNotice('无法读取本地存档，已载入设备快照');
else if(storedUpgradeError) showNotice('设备已加载，但无法保存更新后的本地存档');
</script>
</body>
</html>
